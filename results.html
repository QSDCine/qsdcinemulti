<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resultados | QSDC Multi</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
</head>

<body>
  <div id="app">
    <h1>Resultados</h1>

    <div class="card">
      <p><strong>ID sala:</strong> <span id="roomIdText">...</span></p>
      <p id="winnerText" style="font-size:1.2rem; margin-top:8px;"></p>
    </div>

    <div class="card">
      <h2>Clasificación</h2>
      <ol id="resultsList"></ol>
    </div>

    <div class="row">
      <button id="btnHome" class="primary">Volver al inicio</button>
      <button id="btnLobby" class="secondary">Volver al lobby</button>
    </div>

    <p id="resultsError" class="error" style="display:none;"></p>
  </div>

  <script type="module" src="results.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      const basePath = window.location.pathname.split("/").slice(0, 2).join("/");
      navigator.serviceWorker.register(`${basePath}/service-worker.js`)
        .then(() => console.log("Service Worker registrado"));
    }
  </script>
</body>
</html>
