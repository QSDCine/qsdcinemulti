<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¿Qué sabes de cine?! Multijugador!</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
</head>

<body>
  <div id="app">

    <!-- HOME -->
    <section id="screen-home">
      <h1 class="title">¿Qué sabes de cine?! <br>Multijugador!</h1>
      <p class="subtitle">Se mostrarán fragmentos de bandas sonoras o "themes" y tendréis que adivinar de qué película se trata. <br>¡Competid para ver quién sabe más!</p>

      <div class="home-actions">
        <button id="btn-go-create" class="primary">Crear partida</button>
        <button id="btn-go-join" class="primary">Unirse a partida</button>
        <button id="btn-rls" class="primary">Reglas</button>

      </div>

      <p class="hint">
        Pulsa <strong>Reglas</strong> para ver las diferencias entre todos los modos de juego.
      </p>
    </section>

    <!-- CREATE -->
    <section id="screen-create" style="display:none;">
      <h2>Crear partida</h2>

      <label>Nick</label>
      <input id="create-nick" type="text" autocomplete="off" placeholder="Tu nick" />

      <label>Modo de juego</label>
      <select id="create-modo-juego">
        <option value="normal">Normal</option>
        <option value="contrarreloj">Contrarreloj</option>
        <option value="extremo">Extremo</option>
        <option value="locura">Locura</option>
      </select>

      <label>Modo multijugador</label>
      <select id="create-modo-ronda">
        <option value="todos">Todos responden</option>
        <option value="buzzer">Buzzer</option>
      </select>

      <label>Número de películas (10–300)</label>
      <input id="create-num-pelis" type="number" min="10" max="300" value="10" />

      <label>Número de jugadores</label>
      <input id="create-max-players" type="number" min="2" max="10" value="2" />

      <div class="row">
        <button id="btn-create-room" class="primary">Crear</button>
        <button id="btn-back-from-create" class="secondary">Volver</button>
      </div>

      <p id="create-error" class="error" style="display:none;"></p>
    </section>

    <!-- JOIN -->
    <section id="screen-join" style="display:none;">
      <h2>Unirse a partida</h2>

      <label>Nick</label>
      <input id="join-nick" type="text" autocomplete="off" placeholder="Tu nick" />

      <label>ID de sala</label>
      <input id="join-room-id" type="text" autocomplete="off" placeholder="Ej: A7K9Q2" />

      <div class="row">
        <button id="btn-join-room" class="primary">Unirse</button>
        <button id="btn-back-from-join" class="secondary">Volver</button>
      </div>

      <p id="join-error" class="error" style="display:none;"></p>
    </section>

  </div>

  <script type="module" src="multi.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      const basePath = window.location.pathname.split("/").slice(0, 2).join("/");
      navigator.serviceWorker.register(`${basePath}/service-worker.js`)
        .then(() => console.log("Service Worker registrado"));
    }
  </script>
  <script>
    const btnRules = document.getElementById("btn-rls");
if (btnRules) {
  btnRules.addEventListener("click", () => {
    window.location.href = "rules.html";
  });
}
</script>
</body>
</html>
