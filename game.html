<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partida | QSDC Multi</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
</head>

<body>
  <div id="app">
    <h1>Partida</h1>

    <!-- INFO SALA -->
    <div class="card">
      <p><strong>ID sala:</strong> <span id="roomIdText">...</span></p>
      <p><strong>Modo:</strong> <span id="modoText">...</span></p>
      <p><strong>Multijugador:</strong> <span id="modoRondaText">...</span></p>
      <p><strong>Ronda:</strong> <span id="roundText">-</span></p>
    </div>

    <!-- CUENTA ATRÁS / ESTADO -->
    <div class="card">
      <h2>Cuenta atrás</h2>
      <p id="countdownText" style="font-size: 2rem; margin: 0.2rem 0;">-</p>
      <p id="statusText" class="hint">Esperando sincronización...</p>
    </div>

    <!-- DESCRIPCIÓN (según modo) -->
    <div class="card">
      <h2>Descripción</h2>
      <p id="descriptionText" class="description" style="margin: 0;">
        <!-- game.js lo rellenará -->
      </p>
    </div>

    <!-- AUDIO -->
    <div class="card">
      <h2>Audio</h2>
      <audio id="audio" controls controlsList="nodownload"></audio>
    </div>

    <!-- PISTAS -->
    <div class="card">
      <h2>Pistas</h2>
      <div id="hintsContainer" class="hints"></div>
    </div>

    <!-- RESPUESTA -->
    <div class="card">
      <h2>Respuesta</h2>

      <div class="answer-row">
        <input
          id="answerInput"
          type="text"
          placeholder="Escribe tu respuesta..."
          autocomplete="off"
        />
        <button id="btnAnswer" class="primary">Responder</button>
        <button id="btnSurrender" class="secondary" type="button">Rendirse</button>
      </div>

      <p id="answerStatus" class="hint" style="margin-top: 10px;">
        Aún no has respondido.
      </p>

      <p id="gameError" class="error" style="display:none; margin-top: 10px;"></p>
    </div>

    <!-- JUGADORES -->
    <div class="card">
      <h2>Jugadores</h2>
      <ul id="playersList"></ul>
    </div>

    <!-- MARCADOR -->
    <div class="card">
      <h2>Marcador</h2>
      <ul id="scoreList"></ul>
    </div>

    <!-- VOLVER -->
    <div class="row">
      <button id="btnBack" class="secondary">Volver al lobby</button>
    </div>
  </div>

  <script type="module" src="game.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      const basePath = window.location.pathname.split("/").slice(0, 2).join("/");
      navigator.serviceWorker.register(`${basePath}/service-worker.js`)
        .then(() => console.log("Service Worker registrado"));
    }
  </script>
</body>
</html>
