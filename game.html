<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partida | QSDC Multi</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
</head>

<body>
  <div id="app">
    <div id="quiz-container">
      <h1>Partida</h1>

      <p><strong>ID sala:</strong> <span id="roomIdText">...</span></p>
      <p><strong>Modo:</strong> <span id="modoText">...</span></p>
      <p><strong>Multijugador:</strong> <span id="modoRondaText">...</span></p>
      <p><strong>Ronda:</strong> <span id="roundText">-</span></p>

      <p id="countdownText" style="font-size: 2rem; margin: 0.6rem 0;">-</p>
      <p id="statusText" class="hint">Esperando sincronización...</p>

      <p id="descriptionText" style="margin: 0.8rem 0;"></p>

      <audio id="audio" controls controlsList="nodownload"></audio>

      <div id="hintsContainer"></div>

      <div class="row" style="align-items:center;">
        <input id="answerInput" type="text" placeholder="Escribe tu respuesta..." autocomplete="off" />
        <button id="btnAnswer">Responder</button>
      </div>

      <div class="row">
        <button id="btnSurrender" type="button">Rendirse</button>
      </div>

      <p id="answerStatus" class="hint" style="margin-top: 8px;">Aún no has respondido.</p>
      <p id="gameError" class="error" style="display:none;"></p>

      <hr style="margin: 14px 0; opacity: 0.3;" />

      <h2 style="margin-bottom: 6px;">Jugadores</h2>
      <ul id="playersList"></ul>

      <h2 style="margin: 12px 0 6px;">Marcador</h2>
      <ul id="scoreList"></ul>

      <div class="row">
        <button id="btnBack" class="secondary">Volver al lobby</button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      const basePath = window.location.pathname.split("/").slice(0, 2).join("/");
      navigator.serviceWorker.register(`${basePath}/service-worker.js`)
        .then(() => console.log("Service Worker registrado"));
    }
  </script>
</body>
</html>
